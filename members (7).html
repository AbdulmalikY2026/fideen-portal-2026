<section class="welcome">
    <h2>Member Registration</h2>

    <form onsubmit="registerMember(event)">
        <input id="name" type="text" placeholder="Full Name" required><br><br>

        <input id="department" type="text" placeholder="Department" required><br><br>

        <input id="phone" type="tel" placeholder="Phone Number" required><br><br>

        <input id="email" type="email" placeholder="Email Address" required><br><br>

        <input id="photo" type="file" accept="image/*" required><br><br>

        <button type="submit">Register</button>
    </form>
</section>

<section class="cards">
    <div class="card">
        <h3>Registered Members</h3>
        <div id="memberList"></div>
    </div>
</section>

<footer>
    <p>FIDEEN TV © 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
