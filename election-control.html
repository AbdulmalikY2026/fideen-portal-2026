<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Election Control</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<img src="file_000000006b08720aae07e71ef672adcb.png" alt="FIDEEN Logo">
<h1>Election Control Panel</h1>
<p>Allah Is Our Strength</p>
</header>

<section class="cards">

<div class="card">
<h2>🟢 Start Election</h2>
<button onclick="startElection()">Start</button>
</div>

<div class="card">
<h2>🔴 End Election</h2>
<button onclick="endElection()">End</button>
</div>

<div class="card">
<h2>🗑 Reset Election</h2>
<button onclick="resetElection()">Reset</button>
</div>

</section>

<script src="script.js"></script>

</body>
</html>
