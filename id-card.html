<!DOCTYPE html>
<html>
<head>
    <title>FIDEEN Member ID Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<center>

<div style="width:350px;border:3px solid purple;border-radius:15px;padding:20px;background:white;box-shadow:0 0 10px gray;">

<img src="file_000000006b08720aae07e71ef672adcb.png" width="70">

<h2 style="color:purple;">FIDEEN OFFA BRANCH</h2>

<p><b>Allah Is Our Strength</b></p>

<hr>

<img id="memberPhoto" width="120" height="120" style="border-radius:50%;border:3px solid purple;">

<h2 id="memberName"></h2>

<p><b>Member ID:</b> <span id="memberId"></span></p>

<p><b>Department:</b> <span id="memberDepartment"></span></p>

<p><b>Phone:</b> <span id="memberPhone"></span></p>

<p><b>Email:</b> <span id="memberEmail"></span></p>

<p><b>Date Joined:</b> <span id="joinDate"></span></p>

<button onclick="window.print()">🖨 Print ID Card</button>

</div>

</center>

<script>

let members = JSON.parse(localStorage.getItem("members")) || [];

if(members.length > 0){

let member = members[0];

document.getElementById("memberPhoto").src = member.photo;
document.getElementById("memberName").innerText = member.name;
document.getElementById("memberDepartment").innerText = member.department;
document.getElementById("memberPhone").innerText = member.phone;
document.getElementById("memberEmail").innerText = member.email;
document.getElementById("memberId").innerText = member.id;
document.getElementById("joinDate").innerText = new Date().toLocaleDateString();

}

</script>

</body>
</html>
